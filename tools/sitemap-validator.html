<!doctype html><html lang="ar" dir="rtl"><head>
<script async src="https://www.googletagmanager.com/gtag/js?id=G-JSG9KGPK0S"></script>
<script>window.dataLayer=window.dataLayer||[];function gtag(){dataLayer.push(arguments);}gtag('js',new Date());gtag('config','G-JSG9KGPK0S');</script>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&amp;family=IBM+Plex+Mono:wght@500&amp;display=swap" rel="stylesheet"/><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sitemap Validator | Fawran Tools</title><meta name="description" content="تحقق من بنية Sitemap XML والروابط الأساسية والأخطاء الشائعة."><meta name="keywords" content="sitemap validator, XML sitemap checker, sitemap tester"><meta name="robots" content="index,follow,max-image-preview:large,max-snippet:-1,max-video-preview:-1"><link rel="canonical" href="https://fawran.tools/tools/sitemap-validator.html"><link rel="alternate" hreflang="ar" href="https://fawran.tools/tools/sitemap-validator.html"><link rel="alternate" hreflang="en" href="https://fawran.tools/en/tools/sitemap-validator.html"><link rel="alternate" hreflang="x-default" href="https://fawran.tools/en/tools/sitemap-validator.html"><link rel="icon" href="../favicon.svg"><link rel="stylesheet" href="../assets/style.css"><link rel="manifest" href="../manifest.webmanifest"><script type="application/ld+json">{"@context": "https://schema.org", "@type": "SoftwareApplication", "name": "Sitemap Validator", "url": "https://fawran.tools/tools/sitemap-validator.html", "description": "تحقق من بنية Sitemap XML والروابط الأساسية والأخطاء الشائعة.", "applicationCategory": "UtilitiesApplication", "operatingSystem": "Any", "offers": {"@type": "Offer", "price": "0", "priceCurrency": "USD"}}</script><style>.seo-tool textarea,.seo-tool input,.seo-tool select{width:100%;box-sizing:border-box;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);margin:6px 0 12px}.seo-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}@media(max-width:760px){.seo-grid{grid-template-columns:1fr}}.result-box{white-space:pre-wrap;word-break:break-word;background:var(--surface-sunk);padding:14px;border-radius:10px;min-height:80px}.check-row{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}.score{font-size:34px;font-weight:900;color:var(--indigo-deep)}.small{font-size:13px;color:var(--muted)}table{width:100%;border-collapse:collapse}th,td{padding:9px;border-bottom:1px solid var(--line);text-align:start}</style></head><body><header class="topbar"><div class="topbar-inner"><a class="brand" href="../index.html"><span class="mark">FW</span> Fawran<span class="dot">.</span>tools</a><nav class="nav"><a href="../tools/index.html">الأدوات</a><a href="../blog/index.html">المدونة</a><a href="../about.html">من نحن</a><a href="../contact.html">تواصل معنا</a></nav><a class="lang-switch" href="https://fawran.tools/en/tools/sitemap-validator.html">EN</a></div></header><main class="wrap tool-page"><div class="crumb"><a href="../tools/index.html">الأدوات</a> / <a href="seo.html">أدوات SEO</a> / Sitemap Validator</div><h1>Sitemap Validator</h1><p class="tool-lede">تحقق من بنية Sitemap XML والروابط الأساسية والأخطاء الشائعة.</p><div class="tool-card-shell seo-tool" id="app"></div><div class="content-card" style="margin-top:24px"><h2>لماذا تستخدم هذه الأداة؟</h2><p>Validate sitemap XML structure and inspect URLs for common issues.</p></div></main><script src="../assets/main.js"></script><script src="../assets/share-widget.js"></script><script src="../assets/rating-widget.js"></script><script>/* Fawran SEO tool engine */
const en=false;
const app=document.getElementById('app');
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));}
function box(label,id,ph=''){return `<label><b>${label}</b><textarea id="${id}" placeholder="${ph}"></textarea></label>`}
function btn(label,id='run'){return `<div class="actions"><button class="btn btn-primary" id="${id}">${label}</button></div>`}
const T=(a,b)=>en?b:a;
const slug="sitemap-validator";
const configs={
'seo-audit':()=>{app.innerHTML=box(T('ألصق HTML الصفحة','Paste page HTML'),'html')+btn(T('تدقيق SEO','Run SEO Audit'))+'<div id="out"></div>';document.getElementById('run').onclick=()=>{const h=document.getElementById('html').value;const d=new DOMParser().parseFromString(h,'text/html');const tests=[['Title',!!d.querySelector('title')],['Meta description',!!d.querySelector('meta[name="description"]')],['Canonical',!!d.querySelector('link[rel="canonical"]')],['H1',d.querySelectorAll('h1').length===1],['Viewport',!!d.querySelector('meta[name="viewport"]')],['Images alt',Array.from(d.images).every(i=>i.alt!==undefined&&i.alt!=='')],['HTTPS links',!Array.from(d.querySelectorAll('a[href]')).some(a=>/^http:/.test(a.href))]];const score=Math.round(tests.filter(x=>x[1]).length/tests.length*100);document.getElementById('out').innerHTML=`<p class="score">${score}/100</p>`+tests.map(x=>`<div class="check-row">${x[1]?'✅':'❌'} ${esc(T(x[0],x[0]))}</div>`).join('')}},
'meta-tags-analyzer':()=>{app.innerHTML=box(T('ألصق HTML','Paste HTML'),'html')+btn(T('تحليل Meta Tags','Analyze Meta Tags'))+'<div id="out"></div>';document.getElementById('run').onclick=()=>{const d=new DOMParser().parseFromString(html.value,'text/html');const qs=['title','meta[name="description"]','link[rel="canonical"]','meta[property="og:title"]','meta[property="og:description"]','meta[property="og:image"]','meta[name="twitter:card"]'];out.innerHTML='<table>'+qs.map(q=>`<tr><th>${esc(q)}</th><td>${esc(d.querySelector(q)?.content||d.querySelector(q)?.textContent||'❌ Missing')}</td></tr>`).join('')+'</table>'}},
'serp-snippet-preview':()=>{app.innerHTML=`${box(T('عنوان الصفحة','Page title'),'title')}${box(T('الوصف','Description'),'desc')}${btn(T('معاينة','Preview'))}<div id="out"></div>`;document.getElementById('run').onclick=()=>{out.innerHTML=`<div class="content-card"><h2>${esc(title.value||T('عنوان الصفحة','Page title'))}</h2><p>${esc(desc.value||T('وصف الصفحة','Page description'))}</p><p class="small">${(title.value||'').length} / 60 · ${(desc.value||'').length} / 160</p></div>`}},
'keyword-clustering':()=>{app.innerHTML=box(T('قائمة الكلمات، كلمة في كل سطر','Keywords, one per line'),'keywords')+btn(T('تجميع الكلمات','Cluster Keywords'))+'<div id="out"></div>';document.getElementById('run').onclick=()=>{const rows=keywords.value.split(/\n+/).map(x=>x.trim()).filter(Boolean);const groups={};rows.forEach(k=>{const w=k.toLowerCase().split(/\s+/).filter(x=>x.length>2)[0]||'other';(groups[w]??=[]).push(k)});out.innerHTML=Object.entries(groups).map(([k,v])=>`<div class="content-card" style="margin:10px 0"><b>${esc(k)}</b><p>${v.map(esc).join(' · ')}</p></div>`).join('')}},
'heading-analyzer':()=>{app.innerHTML=box(T('ألصق HTML','Paste HTML'),'html')+btn(T('تحليل العناوين','Analyze Headings'))+'<div id="out"></div>';document.getElementById('run').onclick=()=>{const d=new DOMParser().parseFromString(html.value,'text/html');const hs=[...d.querySelectorAll('h1,h2,h3,h4,h5,h6')];out.innerHTML=`<p class="score">H1: ${d.querySelectorAll('h1').length}</p>`+hs.map(x=>`<div class="check-row"><b>${x.tagName}</b> ${esc(x.textContent.trim())}</div>`).join('')||T('لا توجد عناوين','No headings found')}},
'open-graph-checker':()=>{app.innerHTML=box(T('ألصق HTML','Paste HTML'),'html')+btn(T('فحص Open Graph','Check Open Graph'))+'<div id="out"></div>';document.getElementById('run').onclick=()=>{const d=new DOMParser().parseFromString(html.value,'text/html');const keys=['og:title','og:description','og:image','og:url','og:type'];out.innerHTML=keys.map(k=>`<div class="check-row">${d.querySelector(`meta[property="${k}"]`)?.content?'✅':'❌'} <b>${k}</b> — ${esc(d.querySelector(`meta[property="${k}"]`)?.content||'Missing')}</div>`).join('')}},
'twitter-card-generator':()=>{app.innerHTML=box(T('عنوان الصفحة','Title'),'title')+box(T('الوصف','Description'),'desc')+box(T('رابط الصورة','Image URL'),'image')+btn(T('توليد الوسوم','Generate Tags'))+'<pre id="out" class="result-box"></pre>';document.getElementById('run').onclick=()=>out.textContent=`<meta name="twitter:card" content="summary_large_image">\n<meta name="twitter:title" content="${title.value}">\n<meta name="twitter:description" content="${desc.value}">\n<meta name="twitter:image" content="${image.value}">`},
'canonical-checker':()=>{app.innerHTML=box(T('ألصق HTML','Paste HTML'),'html')+btn(T('فحص Canonical','Check Canonical'))+'<div id="out"></div>';document.getElementById('run').onclick=()=>{const d=new DOMParser().parseFromString(html.value,'text/html');const a=[...d.querySelectorAll('link[rel="canonical"]')];out.innerHTML=`<p class="score">${a.length}</p><p>${a.length===1?esc(a[0].href):T('يجب وجود Canonical واحد فقط','Exactly one canonical is recommended')}</p>`}},
'robots-txt-tester':()=>{app.innerHTML=`<label><b>${T('robots.txt','robots.txt')}</b><textarea id="rules">User-agent: *\nDisallow: /private/\nAllow: /</textarea></label><label><b>${T('المسار','Path')}</b><input id="path" value="/private/test"></label>`+btn(T('اختبار','Test'))+'<div id="out"></div>';document.getElementById('run').onclick=()=>{const p=path.value;let denied=false;rules.value.split(/\n/).forEach(l=>{const m=l.match(/^Disallow:\s*(.*)$/i);if(m&&m[1]&&p.startsWith(m[1]))denied=true});out.innerHTML=`<p class="score">${denied?'DISALLOW':'ALLOW'}</p>`}},
'sitemap-validator':()=>{app.innerHTML=box(T('ألصق Sitemap XML','Paste sitemap XML'),'xml')+btn(T('فحص Sitemap','Validate Sitemap'))+'<div id="out"></div>';document.getElementById('run').onclick=()=>{const d=new DOMParser().parseFromString(xml.value,'application/xml');const err=d.querySelector('parsererror');const urls=d.querySelectorAll('url,loc').length;out.innerHTML=`<p class="score">${err?'❌ Invalid':'✅ Valid XML'}</p><p>${urls} URL/element entries detected.</p>`}},
'schema-validator':()=>{app.innerHTML=box(T('ألصق JSON-LD','Paste JSON-LD'),'json')+btn(T('تحليل Schema','Analyze Schema'))+'<div id="out"></div>';document.getElementById('run').onclick=()=>{try{const x=JSON.parse(json.value);const arr=Array.isArray(x)?x:[x];out.innerHTML='<p class="score">✅ Valid JSON</p>'+arr.map(o=>`<div class="check-row">${esc(o['@type']||'Unknown type')}</div>`).join('')}catch(e){out.innerHTML='<p class="score">❌ Invalid JSON</p><p>'+esc(e.message)+'</p>'}}},
'faq-schema-generator':()=>{app.innerHTML=`<label><b>${T('الأسئلة والأجوبة','Questions and answers')}</b><textarea id="qa" placeholder="Question | Answer\nQuestion | Answer"></textarea></label>`+btn(T('توليد JSON-LD','Generate JSON-LD'))+'<pre id="out" class="result-box"></pre>';document.getElementById('run').onclick=()=>{const main=qa.value.split(/\n/).filter(Boolean).map(l=>{const [q,...a]=l.split('|');return {'@type':'Question','name':q.trim(),'acceptedAnswer':{'@type':'Answer','text':a.join('|').trim()}}});out.textContent=JSON.stringify({'@context':'https://schema.org','@type':'FAQPage','mainEntity':main},null,2)}},
'article-schema-generator':()=>{app.innerHTML=box(T('عنوان المقال','Article title'),'title')+box(T('الوصف','Description'),'desc')+box(T('اسم الكاتب','Author'),'author')+box(T('رابط المقال','Article URL'),'url')+box(T('رابط الصورة','Image URL'),'image')+btn(T('توليد JSON-LD','Generate JSON-LD'))+'<pre id="out" class="result-box"></pre>';document.getElementById('run').onclick=()=>out.textContent=JSON.stringify({'@context':'https://schema.org','@type':'Article','headline':title.value,'description':desc.value,'author':{'@type':'Person','name':author.value},'mainEntityOfPage':url.value,'image':image.value},null,2)},
'local-business-schema':()=>{app.innerHTML=box(T('اسم النشاط','Business name'),'name')+box(T('العنوان','Address'),'address')+box(T('الهاتف','Phone'),'phone')+box(T('الموقع','Website'),'url')+btn(T('توليد JSON-LD','Generate JSON-LD'))+'<pre id="out" class="result-box"></pre>';document.getElementById('run').onclick=()=>out.textContent=JSON.stringify({'@context':'https://schema.org','@type':'LocalBusiness','name':name.value,'address':{'@type':'PostalAddress','streetAddress':address.value},'telephone':phone.value,'url':url.value},null,2)},
'http-status-checker':()=>{app.innerHTML=`<label><b>URL</b><input id="url" placeholder="https://example.com"></label>`+btn(T('فحص الحالة','Check status'))+'<div id="out"></div>';document.getElementById('run').onclick=async()=>{out.innerHTML=T('جارٍ الطلب...','Requesting...');try{const r=await fetch(url.value,{method:'HEAD',mode:'cors'});out.innerHTML=`<p class="score">${r.status} ${esc(r.statusText)}</p>`}catch(e){out.innerHTML='<p>'+T('تعذر الوصول من المتصفح بسبب CORS أو سياسة الخادم.','Browser request blocked by CORS or server policy.')+'</p>'}}},
'url-slug-generator':()=>{app.innerHTML=box(T('العنوان','Title'),'title')+btn(T('توليد Slug','Generate slug'))+'<div id="out"></div>';document.getElementById('run').onclick=()=>{let s=title.value.toLowerCase().trim().replace(/[^\p{L}\p{N}]+/gu,'-').replace(/^-+|-+$/g,'');out.innerHTML='<div class="result-box">'+esc(s)+'</div>'}},
'website-seo-checklist':()=>{const items=T(['HTTPS','Title فريد','Meta Description','H1 واحد','Canonical','Sitemap','Robots.txt','Alt للصور','Internal Links','Mobile friendly'],['HTTPS','Unique title','Meta description','One H1','Canonical','Sitemap','Robots.txt','Image alt text','Internal links','Mobile friendly']);app.innerHTML=items.map((x,i)=>`<label class="check-row"><input type="checkbox" id="c${i}"> <span>${x}</span></label>`).join('')+'<p class="score" id="score">0%</p>';document.querySelectorAll('.seo-tool input[type=checkbox]').forEach(x=>x.onchange=()=>{const n=document.querySelectorAll('input[type=checkbox]:checked').length;score.textContent=Math.round(n/items.length*100)+'%'})},
'page-word-counter':()=>{app.innerHTML=box(T('النص','Text'),'text')+btn(T('تحليل النص','Analyze'))+'<div id="out"></div>';document.getElementById('run').onclick=()=>{const s=text.value.trim();const words=s?s.split(/\s+/).length:0;const chars=s.length;const sentences=(s.match(/[.!؟?]+/g)||[]).length;out.innerHTML=`<div class="seo-grid"><div class="content-card"><b>${T('الكلمات','Words')}</b><p class="score">${words}</p></div><div class="content-card"><b>${T('الأحرف','Characters')}</b><p class="score">${chars}</p></div><div class="content-card"><b>${T('الجمل','Sentences')}</b><p class="score">${sentences}</p></div></div>`}},
'security-headers-checker':()=>{app.innerHTML=box(T('الصق Response Headers','Paste response headers'),'headers')+btn(T('تحليل الحماية','Analyze security'))+'<div id="out"></div>';document.getElementById('run').onclick=()=>{const h=headers.value.toLowerCase();const keys=['content-security-policy','strict-transport-security','x-content-type-options','x-frame-options','referrer-policy','permissions-policy'];out.innerHTML=keys.map(k=>`<div class="check-row">${h.includes(k)?'✅':'⚠️'} ${k}</div>`).join('')}},
'internal-link-checker':()=>{app.innerHTML=box(T('ألصق HTML','Paste HTML'),'html')+btn(T('تحليل الروابط','Analyze links'))+'<div id="out"></div>';document.getElementById('run').onclick=()=>{const d=new DOMParser().parseFromString(html.value,'text/html');const links=[...d.querySelectorAll('a[href]')];const internal=links.filter(a=>a.href.startsWith(location.origin)||a.getAttribute('href')?.startsWith('/')).length;out.innerHTML=`<p class="score">${internal} / ${links.length}</p><p>${T('روابط داخلية','Internal links')}</p>`}},
'image-alt-checker':()=>{app.innerHTML=box(T('ألصق HTML','Paste HTML'),'html')+btn(T('فحص Alt','Check alt text'))+'<div id="out"></div>';document.getElementById('run').onclick=()=>{const d=new DOMParser().parseFromString(html.value,'text/html');const imgs=[...d.images];const bad=imgs.filter(i=>!i.hasAttribute('alt')||!i.alt.trim());out.innerHTML=`<p class="score">${imgs.length-bad.length} / ${imgs.length}</p>`+bad.map(i=>`<div class="check-row">⚠️ ${esc(i.src)}</div>`).join('')}},
};
configs[slug]?.();</script><div class="wrap"><div class="rating-widget" data-tool-slug="sitemap-validator">
  <div class="rating-stars"></div>
  <div><div class="rating-summary"></div><span class="rating-prompt"></span><span class="rating-thanks"></span></div>
</div></div>
<div class="wrap"><div class="share-widget"></div></div>
</body></html>
