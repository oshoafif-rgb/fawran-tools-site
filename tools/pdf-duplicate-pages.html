<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&amp;family=IBM+Plex+Mono:wght@500&amp;display=swap" rel="stylesheet"/><meta content="width=device-width,initial-scale=1" name="viewport"/><title>تكرار صفحات PDF | Fawran Tools</title><meta content="تكرار صفحات محددة داخل ملف PDF وإنشاء نسخة جديدة." name="description"/><meta content="index,follow" name="robots"/><link href="https://fawran.tools/tools/pdf-duplicate-pages.html" rel="canonical"/><link href="https://fawran.tools/tools/pdf-duplicate-pages.html" hreflang="ar" rel="alternate"/><link href="https://fawran.tools/en/tools/pdf-duplicate-pages.html" hreflang="en" rel="alternate"/><link href="https://fawran.tools/en/tools/pdf-duplicate-pages.html" hreflang="x-default" rel="alternate"/><link href="../favicon.svg" rel="icon"/><link href="../assets/style.css" rel="stylesheet"/><style>.toolbox{max-width:820px;margin:28px auto}.toolbox input,.toolbox textarea,.toolbox select{padding:11px;border:1px solid var(--border,#ddd);border-radius:10px;background:var(--surface,#fff);color:inherit}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:14px 0}.status{margin-top:14px;font-weight:700}.muted{color:var(--muted)}.drop{border:2px dashed var(--border,#bbb);border-radius:16px;padding:30px;text-align:center;cursor:pointer}</style></head><body><main><div class="wrap toolbox"><a href="pdf.html">← كل أدوات PDF</a><h1>تكرار صفحات PDF</h1><p class="hero-lede">تكرار صفحات محددة داخل ملف PDF وإنشاء نسخة جديدة.</p><section class="card" style="padding:24px"><div class="drop" id="drop">اسحب ملف PDF هنا أو اضغط للاختيار</div><input accept="application/pdf" hidden="" id="files" multiple="" type="file"/><div class="row"><label>الصفحات / Pages <input id="pages" placeholder="1,3,5-7" size="18"/></label></div><button class="btn btn-primary" id="run">تنفيذ وتحميل</button><div class="status" id="status"></div></section><p class="muted" style="margin-top:18px">تتم المعالجة محليًا في متصفحك ولا يتم رفع ملف PDF إلى خادم.</p></div></main><script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script><script src="../assets/main.js"></script><script src="../assets/share-widget.js"></script><script src="../assets/rating-widget.js"></script><script>const $=id=>document.getElementById(id);let file=null;const drop=$("drop"),input=$("files"),status=$("status");drop.onclick=()=>input.click();input.onchange=()=>{file=input.files[0];drop.textContent=file?file.name:'اسحب ملف PDF هنا أو اضغط للاختيار'};function parsePages(s,n){const out=[];for(const part of s.split(',').map(x=>x.trim()).filter(Boolean)){if(part.includes('-')){let [a,b]=part.split('-').map(Number);a=Math.max(1,a);b=Math.min(n,b);for(let i=a;i<=b;i++)out.push(i-1)}else{let x=Number(part);if(x>=1&&x<=n)out.push(x-1)}}return [...new Set(out)]}function dl(bytes,name){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([bytes],{type:'application/pdf'}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}$("run").onclick=async()=>{if(!file){status.textContent='اختر ملف PDF أولًا';return}try{status.textContent='جارٍ المعالجة…';const src=await PDFLib.PDFDocument.load(await file.arrayBuffer());const out=await PDFLib.PDFDocument.create();let pages=[];const type='pdf-duplicate-pages';if(type==='pdf-rotate'){pages=src.getPages();const a=Number($("angle").value);pages.forEach(p=>p.setRotation(PDFLib.degrees(p.getRotation().angle+a)));out.addPage(p)}else if(type==='pdf-extract-pages'||type==='pdf-delete-pages'||type==='pdf-duplicate-pages'){const sel=parsePages($("pages").value,src.getPageCount());let keep=type==='pdf-delete-pages'?[...Array(src.getPageCount()).keys()].filter(i=>!sel.includes(i)):sel;if(type==='pdf-duplicate-pages')keep=[...Array(src.getPageCount()).keys(),...sel];const cp=await out.copyPages(src,keep);cp.forEach(p=>out.addPage(p))}else if(type==='pdf-reorder-pages'){const order=parsePages($("order").value,src.getPageCount());const cp=await out.copyPages(src,order);cp.forEach(p=>out.addPage(p))}else if(type==='pdf-page-numbers'){const cp=await out.copyPages(src,src.getPageIndices());cp.forEach((p,i)=>{p.drawText(String(Number($("start").value||1)+i),{x:p.getWidth()-45,y:18,size:10,color:PDFLib.rgb(0.35,0.35,0.35)});out.addPage(p)})}else if(type==='pdf-metadata-remover'){const cp=await out.copyPages(src,src.getPageIndices());cp.forEach(p=>out.addPage(p));out.setTitle('');out.setAuthor('');out.setSubject('');out.setKeywords([]);out.setCreator('');out.setProducer('')}else if(type==='pdf-info'){status.textContent='عدد الصفحات: '+src.getPageCount()+' — '+(file.size/1024).toFixed(1)+' KB';return}const bytes=await out.save();dl(bytes,'fawran-pdf-duplicate-pages.pdf');status.textContent='تم إنشاء الملف بنجاح ✓';}catch(e){console.error(e);status.textContent='تعذر معالجة الملف. تأكد أنه PDF صالح.';}};</script><div class="wrap"><div class="rating-widget" data-tool-slug="pdf-duplicate-pages">
