<!doctype html><html lang="en" dir="ltr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Delete PDF Pages | Fawran Tools</title><meta name="description" content="Delete selected pages from a PDF while keeping the remaining pages."><meta name="robots" content="index,follow"><link rel="canonical" href="https://fawran.tools/en/tools/pdf-delete-pages.html"><link rel="alternate" hreflang="ar" href="https://fawran.tools/tools/pdf-delete-pages.html"><link rel="alternate" hreflang="en" href="https://fawran.tools/en/tools/pdf-delete-pages.html"><link rel="alternate" hreflang="x-default" href="https://fawran.tools/en/tools/pdf-delete-pages.html"><link rel="icon" href="../favicon.svg"><link rel="stylesheet" href="../assets/style.css"><style>.toolbox{max-width:820px;margin:28px auto}.toolbox input,.toolbox textarea,.toolbox select{padding:11px;border:1px solid var(--border,#ddd);border-radius:10px;background:var(--surface,#fff);color:inherit}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:14px 0}.status{margin-top:14px;font-weight:700}.muted{color:var(--muted)}.drop{border:2px dashed var(--border,#bbb);border-radius:16px;padding:30px;text-align:center;cursor:pointer}</style></head><body><main><div class="wrap toolbox"><a href="en/tools/pdf.html">← All PDF Tools</a><h1>Delete PDF Pages</h1><p class="hero-lede">Delete selected pages from a PDF while keeping the remaining pages.</p><section class="card" style="padding:24px"><div class="drop" id="drop">Drop a PDF here or click to choose</div><input id="files" type="file" accept="application/pdf" multiple hidden><div class="row"><label>الصفحات / Pages <input id="pages" placeholder="1,3,5-7" size="18"></label></div><button class="btn btn-primary" id="run">Process & Download</button><div class="status" id="status"></div></section><p class="muted" style="margin-top:18px">Processing happens locally in your browser; your PDF is not uploaded to a server.</p></div></main><script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script><script src="../assets/main.js"></script><script>const $=id=>document.getElementById(id);let file=null;const drop=$("drop"),input=$("files"),status=$("status");drop.onclick=()=>input.click();input.onchange=()=>{file=input.files[0];drop.textContent=file?file.name:'Drop a PDF here or click to choose'};function parsePages(s,n){const out=[];for(const part of s.split(',').map(x=>x.trim()).filter(Boolean)){if(part.includes('-')){let [a,b]=part.split('-').map(Number);a=Math.max(1,a);b=Math.min(n,b);for(let i=a;i<=b;i++)out.push(i-1)}else{let x=Number(part);if(x>=1&&x<=n)out.push(x-1)}}return [...new Set(out)]}function dl(bytes,name){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([bytes],{type:'application/pdf'}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}$("run").onclick=async()=>{if(!file){status.textContent='Choose a PDF first';return}try{status.textContent='Processing…';const src=await PDFLib.PDFDocument.load(await file.arrayBuffer());const out=await PDFLib.PDFDocument.create();let pages=[];const type='pdf-delete-pages';if(type==='pdf-rotate'){pages=src.getPages();const a=Number($("angle").value);pages.forEach(p=>p.setRotation(PDFLib.degrees(p.getRotation().angle+a)));out.addPage(p)}else if(type==='pdf-extract-pages'||type==='pdf-delete-pages'||type==='pdf-duplicate-pages'){const sel=parsePages($("pages").value,src.getPageCount());let keep=type==='pdf-delete-pages'?[...Array(src.getPageCount()).keys()].filter(i=>!sel.includes(i)):sel;if(type==='pdf-duplicate-pages')keep=[...Array(src.getPageCount()).keys(),...sel];const cp=await out.copyPages(src,keep);cp.forEach(p=>out.addPage(p))}else if(type==='pdf-reorder-pages'){const order=parsePages($("order").value,src.getPageCount());const cp=await out.copyPages(src,order);cp.forEach(p=>out.addPage(p))}else if(type==='pdf-page-numbers'){const cp=await out.copyPages(src,src.getPageIndices());cp.forEach((p,i)=>{p.drawText(String(Number($("start").value||1)+i),{x:p.getWidth()-45,y:18,size:10,color:PDFLib.rgb(0.35,0.35,0.35)});out.addPage(p)})}else if(type==='pdf-metadata-remover'){const cp=await out.copyPages(src,src.getPageIndices());cp.forEach(p=>out.addPage(p));out.setTitle('');out.setAuthor('');out.setSubject('');out.setKeywords([]);out.setCreator('');out.setProducer('')}else if(type==='pdf-info'){status.textContent='Pages: '+src.getPageCount()+' — '+(file.size/1024).toFixed(1)+' KB';return}const bytes=await out.save();dl(bytes,'fawran-pdf-delete-pages.pdf');status.textContent='Done ✓';}catch(e){console.error(e);status.textContent='Could not process this PDF. Make sure it is valid.';}};</script></body></html>
